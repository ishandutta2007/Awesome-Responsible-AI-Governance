<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19">
        <animate attributeName="stop-color" values="#0b0f19;#111827;#0d1527;#0b0f19" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e1b4b;#111827;#111827" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#050811">
        <animate attributeName="stop-color" values="#050811;#0f172a;#050811;#050811" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #64748b; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Dynamic Glowing Waves -->
  <path d="M0,320 C300,280 400,360 700,310 C1000,260 1100,330 1200,300 L1200,400 L0,400 Z" fill="#38bdf8" opacity="0.04">
    <animate attributeName="d" 
      values="M0,320 C300,280 400,360 700,310 C1000,260 1100,330 1200,300 L1200,400 L0,400 Z;
              M0,310 C350,330 450,270 750,320 C1050,370 1150,280 1200,310 L1200,400 L0,400 Z;
              M0,320 C300,280 400,360 700,310 C1000,260 1100,330 1200,300 L1200,400 L0,400 Z"
      dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Left Side: Emblem + Typography -->
  <g transform="translate(80, 75)" filter="url(#glow)">
    <polygon points="45,10 80,24 80,62 45,92 10,62 10,24" fill="none" stroke="url(#shieldGrad)" stroke-width="4">
      <animate attributeName="stroke-width" values="3;5;3" dur="4s" repeatCount="indefinite" />
    </polygon>
    <path d="M45,28 L62,35 L62,56 L45,72 L28,56 L28,35 Z" fill="url(#shieldGrad)" opacity="0.35" />
    <circle cx="45" cy="50" r="7" fill="#38bdf8">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title & Description -->
  <g transform="translate(190, 110)">
    <text x="0" y="25" class="title">Awesome Responsible AI Governance</text>
    <text x="0" y="65" class="subtitle">&#x1F6E1;&#xFE0F; Trust, Risk, Compliance &amp; Open-Source Model Safety</text>
    <text x="0" y="98" class="tagline">Curated enterprise SaaS platforms, open-source GRC tooling, guardrails, &amp; evaluation stacks</text>
  </g>

  <!-- Feature Pillar Pills -->
  <g transform="translate(190, 245)">
    <rect x="0" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="67" y="21" class="badge-text" text-anchor="middle">&#x2696;&#xFE0F; AI Fairness</text>

    <rect x="150" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <text x="222" y="21" class="badge-text" text-anchor="middle">&#x1F50D; Explainability</text>

    <rect x="310" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <text x="382" y="21" class="badge-text" text-anchor="middle">&#x1F6E1;&#xFE0F; Guardrails</text>

    <rect x="470" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" opacity="0.9" />
    <text x="540" y="21" class="badge-text" text-anchor="middle">&#x1F534; Red Teaming</text>

    <rect x="625" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="702" y="21" class="badge-text" text-anchor="middle">&#x1F4CB; Risk &amp; GRC</text>
  </g>

  <!-- Right Side Interactive Orbital Governance Graphic -->
  <g id="orbital-constellation">
    <circle cx="1020" cy="200" r="42" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="1020" cy="200" r="30" fill="url(#shieldGrad)" opacity="0.3" />
    <text x="1020" y="206" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">AI</text>

    <circle cx="1020" cy="200" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 1020 200" to="360 1020 200" dur="20s" repeatCount="indefinite" />
    </circle>

    <circle cx="1020" cy="200" r="120" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6,8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 1020 200" to="0 1020 200" dur="30s" repeatCount="indefinite" />
    </circle>

    <g>
      <circle cx="970" cy="135" r="9" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="1085" cy="155" r="7" fill="#34d399" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="1070" cy="275" r="8" fill="#f472b6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="945" cy="255" r="6" fill="#fbbf24" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="1020" cy="80" r="6" fill="#c084fc" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;0.95;0.4" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <line x1="1020" y1="200" x2="970" y2="135" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />
    <line x1="1020" y1="200" x2="1085" y2="155" stroke="#34d399" stroke-width="1.2" opacity="0.5" />
    <line x1="1020" y1="200" x2="1070" y2="275" stroke="#f472b6" stroke-width="1.2" opacity="0.5" />
    <line x1="1020" y1="200" x2="945" y2="255" stroke="#fbbf24" stroke-width="1.2" opacity="0.5" />
    <line x1="1020" y1="200" x2="1020" y2="80" stroke="#c084fc" stroke-width="1.2" opacity="0.5" />
  </g>
</svg>
